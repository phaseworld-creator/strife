<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReviewDB - Strife Plugins</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #1a1a2e;
            color: #eaeaea;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            width: 100%;
            background: #16213e;
            border-radius: 12px;
            padding: 40px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }
        h1 {
            font-size: 2rem;
            margin-bottom: 8px;
            color: #fff;
        }
        .author {
            color: #888;
            font-size: 0.9rem;
            margin-bottom: 20px;
        }
        .description {
            font-size: 1.1rem;
            line-height: 1.6;
            color: #ccc;
            margin-bottom: 30px;
        }
        .back {
            display: inline-block;
            padding: 10px 20px;
            background: #0f3460;
            color: #e94560;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 600;
            transition: background 0.2s;
        }
        .back:hover {
            background: #1a508b;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>ReviewDB</h1>
        <p class="author">by maisy (257109471589957632)</p>
        <p class="description">Display and post reviews on user profiles.</p>
        <a href="/strife/" class="back">&larr; Back to all plugins</a>
    </div>
</body>
</html>
